# Quick check for the WIPI core (cores/wipi): unit tests + wie's KTF/LGT "Hello, world!" samples run
# through the core's Session, then an Android arm64 build of the .so. Minutes instead of the full APK run.
name: WIPI core

on:
  push:
    paths:
      - "cores/wipi/**"
      - ".github/workflows/wipi-core.yml"
  pull_request:
    paths:
      - "cores/wipi/**"
  workflow_dispatch:

concurrency:
  group: wipi-core-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Tests (host)
        run: bash cores/wipi/build.sh --test

      - name: Headless run of the wie samples
        run: |
          bash cores/wipi/build.sh --host
          for z in cores/wipi/src/wie/wie-ktf/tests/data/helloworld_ktf.zip cores/wipi/src/wie/wie-lgt/tests/data/helloworld_lgt.zip; do
            cores/wipi/build/host/wipi_headless "$z" --frames 600
          done

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Android build
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          bash cores/wipi/build.sh
          ls -la app/src/main/jniLibs/arm64-v8a/libwipi_libretro.so

      - uses: actions/upload-artifact@v4
        with:
          name: libwipi_libretro-arm64
          path: app/src/main/jniLibs/arm64-v8a/libwipi_libretro.so
          retention-days: 3
